@if (featuredMovie(); as movie) {
  <app-hero [movie]="movie"></app-hero>
} @else {
  <!-- Estado de carga simple (Skeleton) -->
  <div class="loading-hero"></div>
}

<div class="home-sections">
  <app-movie-slider 
    title="Tendencias de Hoy" 
    [movies]="trendingMovies()">
  </app-movie-slider>

  <app-movie-slider 
    title="Las más Populares" 
    [movies]="popularMovies()">
  </app-movie-slider>

  <!-- Catálogo Infinito -->
  <section class="catalog-section">
    <h2 class="section-title">Explorar Catálogo</h2>
    
    <div class="movies-grid">
      @for (movie of catalogMovies(); track movie.id) {
        <app-movie-card [movie]="movie"></app-movie-card>
      }
    </div>

    <!-- El Ancla: Cuando este div entra en pantalla, se cargan más películas -->
    <div #infiniteAnchor class="infinite-anchor">
      @if (isFetchingNextPage()) {
        <div class="infinite-spinner"></div>
        <span>Cargando más películas...</span>
      }
    </div>
  </section>
</div>
